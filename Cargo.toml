[package]
name = "hear"
version = "0.2.3"
edition = "2024"
description = "A Rust library and CLI for transcribing audio with OpenAI, Codex, or whisper.cpp"
license = "MIT"

[features]
default = ["cli"]
cli = ["dep:clap", "dep:cpal", "dep:ctrlc", "dep:directories", "dep:hound", "dep:regex", "dep:whisper-rs"]

[[bin]]
name = "hear"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"], optional = true }
cpal = { version = "0.18", optional = true }
ctrlc = { version = "3.5", optional = true }
directories = { version = "6.0", optional = true }
hound = { version = "3.5", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "multipart", "rustls"] }
regex = { version = "1.12", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.23"

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"], optional = true }

[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs = { version = "0.16", optional = true }

[dev-dependencies]
hound = "3.5"

[profile.release]
lto = "thin"
strip = true
