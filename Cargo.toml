[package]
name = "hear"
version = "0.4.0"
edition = "2024"
description = "A Rust library and CLI for transcribing audio with OpenAI, Codex, or whisper.cpp"
license = "MIT"

[features]
default = ["cli"]
cli = ["workflow", "hear-core/cli", "dep:clap", "dep:ctrlc"]
workflow = ["capture", "local-polish", "dep:directories", "dep:hound", "dep:regex", "dep:sha2", "dep:whisper-rs"]
capture = ["hear-core/capture"]
local-polish = ["dep:hear-local-polish"]

[[bin]]
name = "hear"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
hear-local-polish = { version = "0.4.0", path = "crates/hear-local-polish", optional = true }
hear-core = { version = "0.4.0", path = "crates/hear-core" }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"], optional = true }
ctrlc = { version = "3.5", optional = true }
directories = { version = "6.0", optional = true }
hound = { version = "3.5", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "multipart", "rustls"] }
regex = { version = "1.12", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "0.10", optional = true }
tempfile = "3.23"

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "=0.16.0", path = "vendor/whisper-rs", features = ["metal"], optional = true }

[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs = { version = "=0.16.0", path = "vendor/whisper-rs", optional = true }

[dev-dependencies]
hound = "3.5"

[profile.release]
lto = "thin"
strip = true

[workspace]
exclude = ["vendor/whisper-rs", "vendor/whisper-rs-sys"]
members = ["crates/hear-core", "crates/hear-linux", "crates/hear-local-polish", "crates/hear-macos"]
default-members = ["."]
resolver = "3"
