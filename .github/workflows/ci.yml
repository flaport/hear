name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    env:
      GGML_NATIVE: "OFF"

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install --yes clang cmake libasound2-dev pkg-config

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint all targets
        run: cargo clippy --locked -p hear -p hear-core --all-targets -- -D warnings

      - name: Test full CLI and library
        run: cargo test --locked -p hear -p hear-core --all-targets

      - name: Test minimal library
        run: cargo test --locked --no-default-features --lib

      - name: Test documentation examples
        run: cargo test --locked --doc --no-default-features

      - name: Check minimal-library documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --no-default-features

  linux-companion:
    runs-on: ubuntu-22.04
    env:
      GGML_NATIVE: "OFF"

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install --yes clang cmake libasound2-dev libappindicator3-dev libgtk-3-dev pkg-config

      - name: Test Linux companion
        run: cargo test --locked -p hear-linux

      - name: Lint Linux companion
        run: cargo clippy --locked -p hear-linux --all-targets -- -D warnings

      - name: Build Linux companion
        run: cargo build --locked --release -p hear -p hear-linux -p hear-local-polish

      - name: Test local polishing helper
        run: cargo test --locked -p hear-local-polish

      - name: Lint local polishing helper
        run: cargo clippy --locked -p hear-local-polish --all-targets -- -D warnings

      - name: Verify install script
        run: |
          test -x crates/hear-linux/install.sh
          test -x target/release/hear-app
          test -x target/release/hear
          test -x target/release/hear-local-polish
          PREFIX="$RUNNER_TEMP/hear-install" crates/hear-linux/install.sh
          "$RUNNER_TEMP/hear-install/bin/hear" --help

  macos-companion:
    runs-on: macos-15

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy

      - name: Test macOS companion
        run: cargo test --locked -p hear-macos -p hear-core -p hear-local-polish

      - name: Lint macOS companion
        run: cargo clippy --locked -p hear-macos --all-targets -- -D warnings

      - name: Build signed application bundle
        run: crates/hear-macos/bundle.sh

      - name: Verify application bundle
        run: |
          plutil -lint dist/Hear.app/Contents/Info.plist
          codesign --verify --deep --strict --verbose=2 dist/Hear.app
          test -x dist/Hear.app/Contents/MacOS/hear-macos
          test -x dist/Hear.app/Contents/Helpers/hear
          test -x dist/Hear.app/Contents/Helpers/hear-local-polish
