name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    env:
      GGML_NATIVE: "OFF"

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes clang cmake libasound2-dev pkg-config

      - name: Install Rust target
        run: rustup target add "${{ matrix.target }}"

      - name: Restore Cargo cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-release-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-release-${{ runner.os }}-${{ runner.arch }}-

      - name: Verify tag matches crate version
        shell: bash
        run: |
          crate_version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "hear") | .version')
          if [[ "$crate_version" != "$GITHUB_REF_NAME" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match crate version $crate_version" >&2
            exit 1
          fi

      - name: Build Linux release binaries
        if: runner.os == 'Linux'
        run: cargo build --locked --release -p hear -p hear-linux -p hear-local-polish --target "${{ matrix.target }}"

      - name: Build macOS CLI and application bundle
        if: runner.os == 'macOS'
        env:
          TARGET: ${{ matrix.target }}
        run: crates/hear-macos/bundle.sh

      - name: Verify library-only build
        run: cargo build --locked --release --no-default-features --lib --target "${{ matrix.target }}"

      - name: Package release assets
        shell: bash
        run: |
          mkdir -p artifacts
          tar -C "target/${{ matrix.target }}/release" -czf \
            "artifacts/hear-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz" hear hear-local-polish
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            tar -C "target/${{ matrix.target }}/release" -czf \
              "artifacts/hear-app-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz" hear-app hear hear-local-polish
          else
            ditto -c -k --sequesterRsrc --keepParent dist/Hear.app \
              "artifacts/Hear-${GITHUB_REF_NAME}-${{ matrix.target }}.zip"
          fi

      - name: Upload packaged binaries
        uses: actions/upload-artifact@v7
        with:
          name: hear-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download packaged binaries
        uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Create checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS

      - name: Publish release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* \
              --generate-notes \
              --title "$GITHUB_REF_NAME" \
              --verify-tag
          fi
