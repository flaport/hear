[package]
name = "hear-core"
version = "0.4.0"
edition = "2024"
license = "MIT"
description = "Shared configuration, recording, and process support for hear"

[features]
default = []
cli = ["dep:clap"]
capture = ["dep:cpal", "dep:hound"]

[dependencies]
libc = "0.2"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"], optional = true }
cpal = { version = "0.18", optional = true }
hound = { version = "3.5", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.23"

[dev-dependencies]
toml = "1.1"
