[package]
name = "hear-linux"
version = "0.3.0"
edition = "2024"
description = "A Linux system-tray companion for hear"
license = "MIT"
publish = false

[[bin]]
name = "hear-app"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
cpal = "0.18"
global-hotkey = "0.8"
hound = "3.5"
keyring = "4.2"
libc = "0.2"
rpassword = "7.5"
signal-hook = "0.3"
tempfile = "3.23"
x11rb = { version = "0.13", features = ["allow-unsafe-code"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
