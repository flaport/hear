[package]
name = "hear-linux"
version = "0.5.0"
edition = "2024"
description = "A Linux system-tray companion for hear"
license = "MIT"
publish = false

[[bin]]
name = "hear-app"
path = "src/main.rs"

[dependencies]
hear-core = { path = "../hear-core", features = ["capture"] }
anyhow = "1.0"
global-hotkey = { version = "0.8", features = ["serde"] }
keyring = "4.2"
libc = "0.2"
rpassword = "7.5"
serde = { version = "1.0", features = ["derive"] }
signal-hook = "0.3"
toml = "1.1"
x11rb = { version = "0.13", features = ["allow-unsafe-code"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]

[dev-dependencies]
tempfile = "3.23"
