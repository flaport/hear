[package]
name = "hear-macos"
version = "0.5.0"
edition = "2024"
description = "A macOS menu-bar companion for hear"
license = "MIT"
publish = false

[dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSWorkspace", "NSRunningApplication", "NSStatusItem"] }
hear-core = { path = "../hear-core", features = ["capture"] }
anyhow = "1.0"
arboard = "3.6"
core-graphics = "0.25"
directories = "6.0"
global-hotkey = "0.8"
keyring = "4.2"
objc2-application-services = { version = "0.3", features = ["AXUIElement"] }
rpassword = "7.5"
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
tray-icon = { version = "0.24", default-features = false }
winit = { version = "0.30", default-features = false }

[target.'cfg(not(target_os = "macos"))'.dependencies]
